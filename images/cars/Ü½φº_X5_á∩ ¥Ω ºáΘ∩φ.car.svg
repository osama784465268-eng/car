<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="carPaint" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="glassRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <path d="M0 350 L800 350 M0 400 L800 400 M100 300 L250 450 M400 300 L550 450 M700 300 L850 450" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  <ellipse cx="400" cy="380" rx="340" ry="25" fill="#000000" opacity="0.6" filter="blur(10px)"/>

  <g transform="translate(40, 40)">
    <path d="M 90 260 L 130 180 Q 170 110 270 100 L 450 100 Q 550 100 600 170 L 660 210 Q 690 230 690 260 L 680 300 L 50 300 Z" fill="url(#carPaint)" stroke="#475569" stroke-width="2"/>
    <path d="M 175 175 L 265 112 L 445 112 L 540 175 Z" fill="url(#glassRoof)" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <line x1="360" y1="112" x2="360" y2="175" stroke="#0f172a" stroke-width="8"/>
    <path d="M 100 240 Q 400 220 670 240" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none"/>

    <path d="M 50 260 L 90 250 L 80 275 Z" fill="#60a5fa" filter="url(#glow)"/>
    <path d="M 50 260 L 90 250 L 80 275 Z" fill="#ffffff"/>
    <path d="M 680 250 L 660 270 L 685 270 Z" fill="#ef4444" filter="url(#glow)"/>

    <g transform="translate(190, 290)">
      <circle cx="0" cy="0" r="55" fill="#0f172a"/>
      <circle cx="0" cy="0" r="40" fill="url(#wheelRim)"/>
      <circle cx="0" cy="0" r="15" fill="#cbd5e1"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#334155" stroke-width="5"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#334155" stroke-width="5"/>
    </g>

    <g transform="translate(540, 290)">
      <circle cx="0" cy="0" r="55" fill="#0f172a"/>
      <circle cx="0" cy="0" r="40" fill="url(#wheelRim)"/>
      <circle cx="0" cy="0" r="15" fill="#cbd5e1"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#334155" stroke-width="5"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#334155" stroke-width="5"/>
    </g>

    <rect x="290" y="225" width="30" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="420" y="225" width="30" height="6" rx="3" fill="#cbd5e1"/>
  </g>

  <rect x="30" y="24" width="160" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="110" y="49" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">BMW</text>

  <rect x="580" y="24" width="190" height="38" rx="10" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>
  <text x="675" y="49" fill="#60a5fa" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" text-anchor="middle">X5</text>
</svg>
